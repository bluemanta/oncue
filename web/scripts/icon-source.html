<!doctype html>
<!--
  OnCue 图标源稿（IFM-190）。
  设计：米色底 #F5F2EA + 深蓝 #1E5A8A 的 Fraunces「O」，下方一道 cue 短线，
  呼应结果卡片上目标词的蓝色下划线。

  怎么重新生成 PNG：
  1. 把这个文件复制到 web/public/ 下，启动 npm run dev
  2. 浏览器打开 http://localhost:3000/icon-source.html
  3. 控制台执行 scripts/make-icons.js 里的代码，得到 512/192/180 三个尺寸的 base64
  4. 写入 app/icon.png、app/apple-icon.png、public/icon-192.png、public/icon-512.png
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OnCue 图标源稿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body {
    width: 100vw; height: 100vh;
    background: #F5F2EA;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .o {
    font-family: Fraunces, Georgia, serif;
    font-weight: 600; font-size: 62vmin; line-height: 1;
    color: #1E5A8A; letter-spacing: -0.02em;
    transform: translateY(-4.5vmin);
  }
  .cue {
    position: absolute; bottom: 19vmin;
    width: 26vmin; height: 2.8vmin; border-radius: 1.4vmin;
    background: #1E5A8A;
  }
</style>
</head>
<body><div class="o">O</div><div class="cue"></div></body>
</html>
